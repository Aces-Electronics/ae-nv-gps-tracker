; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

# Dual-slot, so an image can be received over the air at all. huge_app.csv does
# have otadata (0xe000) and its app0 IS subtype ota_0 -- what it does not have is
# a second slot, so there is nowhere to write an incoming image except the one we
# are executing from. That is why this product has never been updatable by any
# means other than USB, and why ota_handler.cpp compares the "next" partition
# against the running one instead of testing it for NULL.
#
# min_spiffs, not default_8MB: the board JSON claims 8 MB flash, but huge_app.csv
# only ever described 4 MB (it ends at 0x400000) and nothing in the tree proves
# what is actually fitted. A 4 MB table on 8 MB flash wastes the top half; an
# 8 MB table on 4 MB flash puts app1 past the end of the device. Only one of those
# is recoverable without a bench, so this stays inside 4 MB until someone reads a
# flash ID off a real unit.
#
# nvs (0x9000, 0x5000) and otadata (0xe000, 0x2000) are byte-identical between
# huge_app.csv and min_spiffs.csv, so the provisioned APN, broker, interval and
# GPS backoff counter survive the reflash. app0 shrinks from 0x300000 to
# 0x1E0000; the image is ~620 KB, about 32% of that.
#
# board_upload.flash_size is deliberately NOT set. It is 8MB from the board JSON
# today and this change does not learn anything new about the hardware, so
# claiming 4 MB here would be a guess written into the bootloader header.
board_build.partitions = min_spiffs.csv

# Enable PSRAM (Octal Mode for S3)
board_build.arduino.memory_type = qio_opi

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_T_SIM7080G_S3
    -DTINY_GSM_MODEM_SIM7080
    -DTINY_GSM_DEBUG=Serial
    ; TinyGSM reads at most this many bytes per +CARECV round trip (default 64).
    ; A ~620 KB OTA image at 64 bytes a time is ~9,700 AT exchanges; at 1 KB it is
    ; ~600. The modem's own +CARECV ceiling is 1460, so this is within spec.
    -DTINY_GSM_RX_BUFFER=1024
    ; Set by CI from OTA_VERSION. Empty on a bench build, which the firmware
    ; reports as empty rather than inventing a number -- see firmwareVersion().
    -DFIRMWARE_VERSION='"${sysenv.OTA_VERSION}"'
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
    ; CONFIG_BT_NIMBLE_ATT_GATT_MAX_ATTR_LEN removed: an ESP-IDF Kconfig name
    ; that NimBLE-Arduino never reads, so it did nothing. The real ceiling is
    ; BLE_ATT_ATTR_MAX_LEN, hardcoded to 512.
    -Wl,--wrap=esp_panic_handler

lib_deps =
    vshymanskyy/TinyGSM@^0.12.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; Was SparkFun_MMA8452Q. That part is on no board this firmware runs on --
    ; nothing ever included it -- and the accelerometer that does exist is the
    ; LIS3DH on the ae-tracker-db daughter board. Adafruit's driver rather than
    ; SparkFun's because the LIS3DH sits on the S3's second I2C controller and
    ; this one takes a TwoWire*; SparkFun's hardcodes Wire.
    adafruit/Adafruit LIS3DH@^1.3.0
    lewisxhe/XPowersLib @ ^0.2.1
    h2zero/NimBLE-Arduino@^1.4.1
    ae-crash-handler

# Vehicle bring-up build. Boots straight into a listen-only CAN sniffer and
# never reaches the tracker's normal cycle -- no modem, no MQTT, no sleep.
#
# Listen-only cannot put a single bit on the bus, not even an ACK, so this is
# safe to plug into a running ski before anything is known about what is on
# there or what rate it runs at.
#
#   pio run -e can-sniffer -t upload && pio device monitor
#
# default_envs above keeps this out of a bare `pio run`, so the shipping
# firmware is still what builds by default and in CI.
[env:can-sniffer]
extends = env:esp32-s3-devkitm-1
build_flags = ${env:esp32-s3-devkitm-1.build_flags} -DCAN_SNIFFER_MODE


# Daughter-board bench build. Probes the LIS3DH, reads it, and reports the
# charger pins in a loop forever -- no modem, no MQTT, no deep sleep.
#
# The shipping firmware sleeps a few minutes after boot, and deep sleep drops
# the USB CDC port, so iterating on the bench with it means waiting for the
# device to re-enumerate every time. This build stays up.
#
#   pio run -e db-bench -t upload && pio device monitor
[env:db-bench]
extends = env:esp32-s3-devkitm-1
build_flags = ${env:esp32-s3-devkitm-1.build_flags} -DDB_BENCH_MODE

# On-water survey build. Logs GPS speed alongside every byte of every CAN ID as
# CSV, so the speed signal can be found by correlation the same way RPM was
# found against the tacho. No MQTT, no sleep.
#
# Needed because published SeaDoo speed IDs (0x208, 0x268) do not exist on this
# ski's bus -- see docs/can/seadoo-can.md -- so it cannot be looked up.
#
#   pio run -e speed-survey -t upload && pio device monitor -b 115200 | tee survey.csv
[env:speed-survey]
extends = env:esp32-s3-devkitm-1
build_flags = ${env:esp32-s3-devkitm-1.build_flags} -DSPEED_SURVEY_MODE
